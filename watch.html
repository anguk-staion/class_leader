<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="origin">
<title>WEEK 1 교육 영상</title>
<style>html,body{margin:0;height:100%;background:#000}</style>
<script>
// 교안(로컬 파일)에서 새 창으로 열 때 거쳐 가는 페이지입니다.
// 로컬 파일은 유튜브에 출처를 보내지 못해 영상 전용 주소가 '오류 153'으로 막히므로,
// 이 페이지에서 출처를 실어 유튜브 영상 전용 주소로 바로 넘깁니다. 주소창에는 유튜브 주소만 남습니다.
(() => {
  const id = new URLSearchParams(location.search).get('v') || 'Gn-6VagoMUs';
  location.replace('https://www.youtube.com/embed/' + encodeURIComponent(id) +
    '?autoplay=1&rel=0&iv_load_policy=3&cc_load_policy=0');
})();
</script>
</head>
