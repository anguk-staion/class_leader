<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEEK 1 교육 영상 | LEAD → AI × WORK</title>
<style>
html,body{margin:0;height:100%;background:#000}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#box{width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;position:relative}
#box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<div id="stage"><div id="box"><div id="player"></div></div></div>
<script>
// 교안에서 새 창으로 여는 WEEK 1 영상 플레이어 (자동 자막 끔). 주소 뒤 ?v=영상ID 로 다른 영상도 재생할 수 있습니다.
(() => {
  const id = new URLSearchParams(location.search).get('v') || 'Gn-6VagoMUs';
  // 자동 자막 끄기 (시청자가 CC 버튼으로 다시 켤 수는 있습니다)
  const captionsOff = p => {
    try { p.unloadModule('captions'); } catch (e) {}
    try { p.unloadModule('cc'); } catch (e) {}
  };
  let offCount = 0;
  window.onYouTubeIframeAPIReady = () => {
    new YT.Player('player', {
      videoId: id,
      playerVars: { autoplay: 1, rel: 0, playsinline: 1, cc_load_policy: 0, iv_load_policy: 3, origin: location.origin },
      events: {
        onReady: e => {
          const f = e.target.getIframe();
          f.title = 'WEEK 1 교육 영상';
          f.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen');
          captionsOff(e.target);
          e.target.playVideo();
          f.focus();
        },
        // 재생 시작 직후 자막 모듈이 다시 붙는 경우가 있어 처음 몇 번은 한 번 더 끕니다
        onStateChange: e => { if (e.data === YT.PlayerState.PLAYING && offCount < 3) { offCount++; captionsOff(e.target); } }
      }
    });
  };
  const sc = document.createElement('script');
  sc.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(sc);
})();
</script>
</body>
</html>
